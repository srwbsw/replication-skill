# Phase 3+: drop into target repo .github/workflows/
name: Replication gate
on: [pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm replicate catalog --check
      # - run: pnpm replicate build-reference --check
      # - run: pnpm build && pnpm replicate gate --all
